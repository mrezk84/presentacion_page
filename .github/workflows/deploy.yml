name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # El deployment se quedó en `deployment_queued` más de 10 minutos y
          # la acción abortó con su timeout por defecto. Al cancelarse, el
          # deployment queda marcado para ese SHA y ningún reintento sobre el
          # mismo commit vuelve a levantar: el ID del deployment ES el SHA, así
          # que todo re-run posterior muere al instante con "Deployment
          # cancelled". Con 20 minutos la cola de Pages tiene margen para
          # drenar antes de que abortemos y dejemos el commit inservible.
          timeout: 1200000
