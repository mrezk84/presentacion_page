name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Sin este secret el formulario cae a mailto:, que es el respaldo
          # previsto. Definirlo en Settings -> Secrets and variables ->
          # Actions con el ID del formulario de Formspree lo activa.
          VITE_FORMSPREE_ENDPOINT: ${{ secrets.VITE_FORMSPREE_ENDPOINT }}
          # Eleva el límite de la API de GitHub de 60 a 5000 peticiones por
          # hora durante el build. Sin esto la IP compartida del runner se
          # topaba con el 403 y la sección de repositorios salía vacía.
          # Es el token efímero del propio workflow: sólo lee lo público.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # `timeout` no se toca: la acción lo capa en 600000 ms y avisa por
      # warning si se pide más, así que el default YA es el máximo. Si la cola
      # de Pages tarda más que eso, la acción cancela el deployment y deja el
      # SHA quemado — ningún re-run sobre ese mismo commit vuelve a levantar,
      # porque el ID del deployment es el propio SHA. En ese caso hace falta un
      # commit nuevo, no un reintento.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
